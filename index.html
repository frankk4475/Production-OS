<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Production OS | Studio Control Room</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
      {
        const theme = localStorage.getItem("theme");
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === 'dark' || (!theme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }
    </script>
    <script>
      // Detect if this is an OAuth popup callback
      if (window.opener && window.location.hash.includes('access_token=')) {
        try {
          const hash = window.location.hash;
          const stateMatch = hash.match(/state=([^&]*)/);
          const state = stateMatch ? stateMatch[1] : '';
          window.opener.postMessage({
            type: 'GOOGLE_AUTH_CALLBACK',
            hash: hash,
            state: state
          }, window.location.origin);
          window.close();
        } catch (e) {
          console.error('Error posting message to opener:', e);
        }
      }
    </script>
    <script>
      window.addEventListener('error', function(e) {
        console.error("Global window error captured:", e);
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="min-height:100vh;background:#090d16;color:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif;text-align:center;">' +
            '<div style="width:64px;height:64px;border-radius:16px;background:rgba(204,164,59,0.1);border:1px solid rgba(204,164,59,0.3);color:#cca43b;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 1rem auto;">🎬</div>' +
            '<h1 style="font-size:1.5rem;font-weight:800;margin-bottom:0.5rem;color:#ffffff;">กำลังเริ่มระบบ Production OS...</h1>' +
            '<p style="font-size:0.875rem;color:#94a3b8;max-width:400px;margin-bottom:1.5rem;">หากระบบไม่โหลดอัตโนมัติเนื่องจากแคชของเบราว์เซอร์ โปรดคลิกปุ่มล้างแคชและรีโหลดด้านล่าง</p>' +
            '<div style="display:flex;gap:12px;">' +
            '<button onclick="window.location.hash=\'#/dashboard\';window.location.reload(true)" style="padding:10px 20px;background:#cca43b;color:#090d16;font-weight:900;border:none;border-radius:12px;cursor:pointer;">↻ รีโหลดระบบ & ไปที่ Dashboard</button>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();window.location.hash=\'#/dashboard\';window.location.reload(true)" style="padding:10px 20px;background:#1e293b;color:#e2e8f0;font-weight:700;border:none;border-radius:12px;cursor:pointer;">ล้างข้อมูลแคช</button>' +
            '</div>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body class="transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
